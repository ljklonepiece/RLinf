# GR00T N1.7 + RLinf PPO on the IN-PROCESS IsaacLab-Arena G1 drill_lift env.
# PLUMBING / sign-of-life on the PUBLIC nvidia/GR00T-N1.7-3B base.
#
# WHY "plumbing": the public base does NOT ship the real Arena G1 embodiment
# (unitree_g1_full_body_with_waist_height_nav_cmd) -- only real_g1_relative_eef_relative_joints.
# So obs_converter_type/embodiment_tag = isaaclab_arena_g1_eef best-effort maps the Arena
# 43-d joint state into that eef embodiment (wrist-eef groups identity-filled, legs dropped)
# and extracts the 35-d Arena action from the model's 53-d output. The policy is UNTRAINED
# for drill_lift; this proves the full IsaacLab->RLinf->Arena->GR00T loop, not task success.
#
# For a REAL drill_lift policy, swap to a BC-finetuned ckpt and use the real converter:
#   rollout.model.model_path / actor.model.model_path = <BC drill_lift ckpt>
#   obs_converter_type: isaaclab_arena_g1   embodiment_tag: isaaclab_arena_g1
#
# Run (literal IsaacLab entrypoint):
#   RLINF_EXT_MODULE=isaaclab_contrib.rl.rlinf.extension \
#   python <IsaacLab>/scripts/reinforcement_learning/rlinf/train.py \
#     --config_path /home/juekunl/Work/arena_local_bringup \
#     --config_name drill_lift_g1_n17_plumbing \
#     --model_path /home/juekunl/Work/models/GR00T-N1.7-3B

defaults:
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    transport_device: cpu
    delta_encoding: True
    compression: none
    init_sync:
      enabled: True
      prefixes: null
      bucket_size: 134217728

runner:
  task_type: embodied
  logger:
    log_path: "/home/juekunl/Work/arena_local_bringup/m3_results"
    project_name: rlinf
    experiment_name: "drill_lift_g1_n17_plumbing"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: -1
  seq_length: 4096
  max_prompt_length: 30
  resume_dir: null
  dry_run: True

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  channel:
    name: "env_buffer_list"
    queue_name: "obs_buffer"
    queue_size: 0
  enable_offload: False
  train:
    env_type: isaaclab_arena
    total_num_envs: 4
    auto_reset: False
    ignore_terminations: False
    use_rel_reward: False
    seed: 0
    group_size: 1
    reward_coef: 1.0
    rollout_epoch: 1
    use_fixed_reset_state_ids: False
    max_steps_per_rollout_epoch: 8
    max_episode_steps: 128
    video_cfg:
      save_video: False
      info_on_video: False
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/train
    init_params:
      id: "LMDrillLiftRlD1"
      num_envs: null
      device: "cuda:0"
      max_episode_steps: ${env.train.max_episode_steps}
      task_description: "Lift the drill from the table."
      reward_mode: sparse
      embodiment: "g1_gr00t"
      lift_height: 0.16
      state_key: "robot_joint_pos"
      camera_key: "robot_head_cam_rgb"
  eval:
    env_type: isaaclab_arena
    total_num_envs: 1
    is_eval: True
    auto_reset: False
    ignore_terminations: True
    use_rel_reward: False
    seed: 0
    group_size: 1
    reward_coef: 1.0
    rollout_epoch: 1
    use_fixed_reset_state_ids: False
    max_steps_per_rollout_epoch: 8
    max_episode_steps: 128
    video_cfg:
      save_video: False
      info_on_video: False
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      id: "LMDrillLiftRlD1"
      num_envs: null
      device: "cuda:0"
      max_episode_steps: ${env.eval.max_episode_steps}
      task_description: "Lift the drill from the table."
      reward_mode: sparse
      embodiment: "g1_gr00t"
      lift_height: 0.16
      state_key: "robot_joint_pos"
      camera_key: "robot_head_cam_rgb"

rollout:
  group_name: "RolloutGroup"
  channel:
    name: ${env.channel.name}
    queue_name: "action_buffer"
    queue_size: 0
  mode: "colocate"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: /home/juekunl/Work/models/GR00T-N1.7-3B
    backbone_model_path: /home/juekunl/Work/models/Cosmos-Reason2-2B
    precision: ${actor.model.precision}
    obs_converter_type: isaaclab_arena_g1_eef
    embodiment_tag: isaaclab_arena_g1_eef

actor:
  group_name: "ActorGroup"
  channel:
    name: ${env.channel.name}
    queue_name: "replay_buffer"
    queue_size: 0
  training_backend: "fsdp"
  num_gpus: 1
  micro_batch_size: 1
  global_batch_size: 1
  seed: 1234
  enable_offload: False
  model:
    model_type: "gr00t_n1d7"
    model_path: ${rollout.model.model_path}
    backbone_model_path: ${rollout.model.backbone_model_path}
    precision: "bf16"
    trust_remote_code: True
    is_lora: false
    action_dim: 35
    num_action_chunks: 8
    env_execute_chunks: 1
    gradient_checkpointing: true
    denoising_steps: 4
    obs_converter_type: ${rollout.model.obs_converter_type}
    embodiment_tag: ${rollout.model.embodiment_tag}
    add_value_head: True
    # Backbone classes the N1.7 loader confirms for the public Cosmos/Qwen3-VL base, plus
    # the RL heads RLinf attaches. FSDP skips any name not present in the model.
    no_split_modules:
      - "Qwen3VLTextDecoderLayer"
      - "Qwen3VLVisionBlock"
      - "BasicTransformerBlock"
      - "FlowMatchingActionHeadForRLActionPrediction"
      - "ValueHead"
      - "ExploreNoiseNet"
    rl_head_config:
      joint_logprob: False
      noise_method: "flow_sde"
      ignore_last: False
      safe_get_logprob: False
      noise_anneal: False
      noise_params: [0.7, 0.3, 400]
      noise_level: 0.3
      add_value_head: ${actor.model.add_value_head}
      chunk_critic_input: False
      detach_critic_input: True
      disable_dropout: True
      use_vlm_value: False
      value_vlm_mode: "mean_token"
      padding_value: 570
  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: "fsdp"
    transformer_layer_cls_to_wrap:
      - "Qwen3VLTextDecoderLayer"
      - "Qwen3VLVisionBlock"
      - "BasicTransformerBlock"
      - "FlowMatchingActionHeadForRLActionPrediction"
      - "ValueHead"
      - "ExploreNoiseNet"
    use_orig_params: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
