# Minimal RLinf config for the in-process Arena G1 drill_lift env.
# Used by m2b_entrypoint_env_launch.py to drive RLinf's REAL Cluster + EnvWorker
# (the IsaacLab entrypoint's env path) to BUILD the Arena env via Ray + register(),
# with NO GR00T checkpoint (actor/rollout model_path is a placeholder; the env worker
# never loads weights -- only actor/rollout do, and we don't launch them here).

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all   # single GPU here (CUDA_VISIBLE_DEVICES=0) -> world_size 1 each

weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    transport_device: cpu
    delta_encoding: True
    compression: none
    init_sync:
      enabled: True
      prefixes: null
      bucket_size: 134217728

runner:
  task_type: embodied
  logger:
    log_path: "/home/juekunl/Work/arena_local_bringup/m2b_results"
    project_name: rlinf
    experiment_name: "m2b_entrypoint_env"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: -1
  seq_length: 4096
  max_prompt_length: 30
  resume_dir: null
  dry_run: True
  use_training_pipeline: False

algorithm:
  normalize_advantages: True
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  shuffle_rollout: True

env:
  group_name: "EnvGroup"
  channel:
    name: "env_buffer_list"
    queue_name: "obs_buffer"
    queue_size: 0
  enable_offload: False
  train:
    env_type: isaaclab_arena
    total_num_envs: 1
    auto_reset: False
    ignore_terminations: False
    use_rel_reward: False
    seed: 0
    group_size: 1
    reward_coef: 1.0
    rollout_epoch: 1
    use_fixed_reset_state_ids: False
    max_steps_per_rollout_epoch: 8
    max_episode_steps: 256
    enable_offload: False
    video_cfg:
      save_video: False
      info_on_video: False
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/train
    init_params:
      id: "LMDrillLiftRlD1"
      num_envs: null
      device: "cuda:0"
      max_episode_steps: ${env.train.max_episode_steps}
      task_description: "Lift the drill from the table."
      reward_mode: sparse
      embodiment: "g1_wbc_pink"
      lift_height: 0.16
      state_key: "robot_joint_pos"
      camera_key: "robot_head_cam_rgb"

rollout:
  group_name: "RolloutGroup"
  channel:
    name: ${env.channel.name}
    queue_name: "action_buffer"
    queue_size: 0
  mode: "colocate"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  collect_transitions: False
  collect_prev_infos: True
  model:
    model_path: "/tmp/placeholder_gr00t_ckpt"   # NOT loaded by the env worker
    precision: "bf16"
    obs_converter_type: "passthrough"
    embodiment_tag: "new_embodiment"

actor:
  group_name: "ActorGroup"
  channel:
    name: ${env.channel.name}
    queue_name: "replay_buffer"
    queue_size: 0
  training_backend: "fsdp"
  num_gpus: 1
  micro_batch_size: 1
  global_batch_size: 1
  seed: 1234
  enable_offload: False
  model:
    model_type: "gr00t_n1d7"
    model_path: ${rollout.model.model_path}
    precision: "bf16"
    trust_remote_code: True
    is_lora: false
    action_dim: 23
    num_action_chunks: 1
    env_execute_chunks: 1
    obs_converter_type: ${rollout.model.obs_converter_type}
    embodiment_tag: ${rollout.model.embodiment_tag}
    add_value_head: True

reward:
  use_reward_model: False

critic:
  use_critic_model: False
