# DSRL (Diffusion Steering via RL) on GR00T N1.7, LIBERO-Spatial.
#
# De-risk config (S2.4): same DSRL recipe as the working openpi DSRL config
# (libero_spatial_dsrl_openpi.yaml), but with the GR00T N1.7 model. It exercises the
# S2.1/S2.2/S2.3 plumbing (model SAC heads + model-agnostic SAC worker) on a NON-Arena
# env before the Arena drill_lift run (S3 = drill_lift_dsrl_gr00t_n1d7.yaml).
#
# Run a local validation first (no real job): set `runner.dry_run=true`.
# NOTE: paths below are placeholders -- point them at a BC-finetuned GR00T N1.7 LIBERO
# checkpoint + the Cosmos-Reason2-2B backbone before running for real.

defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/gr00t_n1d7@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_dsrl_gr00t_n1d7"
    logger_backends: ["tensorboard"]

  max_epochs: 20000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 200

  # Pre-submit gate: build everything + 1 rollout + 1 update, skip val/eval/ckpt, exit 0.
  # Override on the CLI: `runner.dry_run=true`.
  dry_run: False

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 200
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  agg_q: mean
  actor_agg_q: mean
  backup_entropy: False
  critic_subsample_size: 0
  critic_actor_ratio: 1

  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    # DSRL acts on the NOISE (dim == model_action_dim, NOT env action_dim). LIBERO GR00T
    # pads to max_action_dim (~32), so use ~ -noise_dim/2 (matches the openpi DSRL config).
    # Re-tune once the checkpoint's max_action_dim is confirmed.
    target_entropy: -16
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 15000
    sample_window_size: 15000
    min_buffer_size: 10
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 10

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: False
    use_rel_reward: False
    use_step_penalty: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    specific_reset_id: 0
    use_ordered_reset_state_ids: True
  eval:
    rollout_epoch: 1
    total_num_envs: 500
    auto_reset: True
    use_rel_reward: False
    use_step_penalty: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    is_eval: True
    group_size: 1
    specific_reset_id: 0
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: /path/to/GR00T-N1.7-LIBERO/libero_spatial  # TODO(S4): BC-finetuned ckpt
    backbone_model_path: /path/to/Cosmos-Reason2-2B
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 32
  seed: 1234
  enable_offload: False

  model:
    model_type: "gr00t_n1d7"
    model_path: /path/to/GR00T-N1.7-LIBERO/libero_spatial  # TODO(S4): BC-finetuned ckpt
    backbone_model_path: /path/to/Cosmos-Reason2-2B
    embodiment_tag: "libero_sim"
    obs_converter_type: "libero"
    action_dim: 7
    num_action_chunks: 8
    denoising_steps: 4
    # DSRL trains its own SAC critic, not the flow value head.
    add_value_head: False

    rl_head_config:
      use_dsrl: True
      # dsrl_action_noise_dim is intentionally OMITTED -> auto-derives from the diffusion
      # latent dim (action_head.model_action_dim); setting it would assert equality.
      dsrl_state_dim: 8            # LIBERO env state width (x,y,z,r,p,y,gripper)
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims: [128, 128, 128]

  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5

  critic_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
