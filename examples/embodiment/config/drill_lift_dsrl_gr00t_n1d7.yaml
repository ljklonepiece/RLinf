# DSRL (Diffusion Steering via RL) on GR00T N1.7, IsaacLab-Arena G1 drill_lift.
#
# Local end-to-end config (S3): a FROZEN public/BC GR00T N1.7 base steered by a SAC agent
# on the Arena drill_lift task. Single env / single rollout for local visualization.
#
# Prereqs to run:
#   1) Start the Arena env server (py3.12, separate process) -- it hosts the sim and the
#      RLinf env worker connects over a socket (see env.train.init_params.server):
#        ARENA_PORT=5557 ARENA_ENV=LMDrillLiftRlD1 ARENA_NUM_ENVS=1 \
#          /home/juekunl/Work/arena_local_bringup/run_arena_server.sh
#      For on-screen DSRL exploration, launch that server with a display (non-headless).
#   2) Point the model paths below at the BC-finetuned drill_lift GR00T N1.7 ckpt (S4)
#      + the Cosmos-Reason2-2B backbone.
#
# Pre-submit gate (no real job): `runner.dry_run=true` -> builds workers+env+model, runs
# 1 rollout + 1 SAC update, skips val/eval/ckpt, prints "DRY RUN OK".

defaults:
  - env/isaaclab_arena_drill_lift@env.train
  - env/isaaclab_arena_drill_lift@env.eval
  - model/gr00t_n1d7@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "drill_lift_dsrl_gr00t_n1d7"
    logger_backends: ["tensorboard"]

  max_epochs: 20000
  max_steps: -1

  only_eval: False
  val_check_interval: -1   # eval needs a SECOND Arena server (see env.eval.server.port)
  save_interval: 200

  # Pre-submit gate: 1 rollout + 1 update, skip val/eval/ckpt, exit 0. CLI: runner.dry_run=true
  dry_run: False

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 200
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  agg_q: mean
  actor_agg_q: mean
  backup_entropy: False
  critic_subsample_size: 0
  critic_actor_ratio: 1

  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    # DSRL acts on the NOISE; for G1, model_action_dim == action_dim == 35, so the noise
    # dim is 35. Use ~ -noise_dim/2 (consistent with the openpi DSRL config); tune.
    target_entropy: -17
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 15000
    sample_window_size: 15000
    min_buffer_size: 10
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 10

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    total_num_envs: 1          # single env for local visualization
    auto_reset: False
    init_params:
      num_envs: 1
  eval:
    total_num_envs: 1
    is_eval: True
    group_size: 1
    ignore_terminations: True
    init_params:
      num_envs: 1
      # A real eval run needs a SECOND Arena server (the train one owns 5557).
      server:
        port: 5558

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: /path/to/GR00T-N1.7-drill_lift   # TODO(S4): BC-finetuned drill_lift ckpt
    backbone_model_path: /path/to/Cosmos-Reason2-2B
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 8
  seed: 1234
  enable_offload: False

  model:
    model_type: "gr00t_n1d7"
    model_path: /path/to/GR00T-N1.7-drill_lift   # TODO(S4): BC-finetuned drill_lift ckpt
    backbone_model_path: /path/to/Cosmos-Reason2-2B
    embodiment_tag: "isaaclab_arena_g1"
    obs_converter_type: "isaaclab_arena_g1"
    action_dim: 35
    num_action_chunks: 8
    denoising_steps: 4
    # DSRL trains its own SAC critic, not the flow value head.
    add_value_head: False

    rl_head_config:
      use_dsrl: True
      # dsrl_action_noise_dim OMITTED -> auto-derives from model_action_dim (== 35 for G1).
      dsrl_state_dim: 43          # G1 policy state (7 joint groups, see g1 modality.json)
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims: [128, 128, 128]

  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5

  critic_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
